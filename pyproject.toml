[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ChatWord"
dynamic = ["version"]
description = "ChatWord: Word document workflows for ChatArch."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["click>=8.0", "chatstyle>=0.1.0", "chatenv>=0.1.1"]
authors = [{name = "ChatArch", email = "1073853456@qq.com"}]
keywords = ["chatword", "chatarch", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ChatArch/ChatWord"
Repository = "https://github.com/ChatArch/ChatWord"
Documentation = "https://ChatArch.github.io/ChatWord"

[project.scripts]
chatword = "chatword.cli:main"

[project.optional-dependencies]
word = ["python-docx>=1.1.2", "mammoth>=1.8.0"]
pdf = ["pypdf>=5.0.0", "pdfplumber>=0.11.0"]
ocr = ["pdf2image>=1.17.0", "pytesseract>=0.3.13"]
all = [
    "python-docx>=1.1.2",
    "mammoth>=1.8.0",
    "pypdf>=5.0.0",
    "pdfplumber>=0.11.0",
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.13",
]
dev = ["build", "pytest", "twine"]
docs = ["mkdocs>=1.4.0", "mkdocs-material>=9.0.0", "mike>=2.0.0"]

[tool.setuptools.dynamic]
version = {attr = "chatword.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
